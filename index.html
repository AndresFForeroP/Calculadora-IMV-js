<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/app.js" defer></script>
    <link rel="stylesheet" href="/css/styles.css">
    <title>Calculadora IMC</title>
</head>
<body>
    <header>
        <h1>Calculadora IMC</h1>
    </header>
    <section>
        <div class="div-superior">
            <form action="" id="form-data">
                <div class="formulario">
                    <div class="form-izquierda">
                        <div class="from-div-datos">
                            <p>Edad</p>
                            <input placeholder="Ingrese su edad" type="number" name="edad"> 
                        </div>
                        <div class="from-div-datos">
                            <p>Peso</p>
                            <input placeholder="Ingrese su peso en kg, ej: 63" type="text" name="peso"> 
                        </div>
                    </div>
                    <div class="form-derecha">
                        <div class="from-div-datos">
                            <p>Nombre</p>
                            <input placeholder="Ingrese su nombre" type="text" name="nombre"> 
                        </div>
                        <div class="from-div-datos">
                            <p>Estatura</p>
                            <input placeholder="Ingrese su estatura en metros" type="text" name="estatura"> 
                        </div>
                    </div>
                </div>
                <button  id="boton-calcular">Calcular</button>
            </form>
        </div>
        <div class="div-inferior" id="div-infer">
            
        </div>
    </section>
</body>
</html>
